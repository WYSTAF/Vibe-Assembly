name: DIAG
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose
        run: |
          set +e
          {
            echo "node=$(node --version)"
            echo "--- npm test ---"
            npm test 2>&1 | tail -100
          } > diag-output.txt 2>&1
          echo "--- captured ---"
          cat diag-output.txt
      - name: Push diagnosis
        run: |
          git config user.name ci
          git config user.email ci@local
          git add diag-output.txt
          git commit -q -m "ci: diagnosis output" || echo "no change"
          git push origin HEAD:main
