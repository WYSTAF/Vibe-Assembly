name: DIAG
on:
  push:
    branches: [main]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose
        run: |
          set +e
          {
            echo "node=$(node --version)"
            echo "os=$(uname -a)"
            echo "--- npm test ---"
            npm test 2>&1 | tail -80
            echo "npm test exit=${PIPESTATUS[0]}"
          } > diag-output.txt 2>&1
      - name: Commit diagnosis
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push diagnosis
        run: |
          git config user.name ci
          git config user.email ci@local
          git add diag-output.txt
          git commit -q -m "ci: diagnosis output" || echo "no change"
          git push origin HEAD:main
